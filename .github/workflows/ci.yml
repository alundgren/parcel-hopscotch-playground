name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 1.0.0-rc.0
          node-version: 24.19.0
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run typecheck
      - run: vp test run --project=server
      - run: vp run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 1.0.0-rc.0
          node-version: 24.19.0
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: vp run proof:visual
        env:
          CI: true
      - run: vp run test:e2e
        if: ${{ !cancelled() }}
        env:
          CI: true
      - name: Retain browser reports, checkpoint screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.run_attempt }}
          path: |
            artifacts/visual
            tests/browser/__traces__
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
