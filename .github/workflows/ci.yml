name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - name: Retain Playwright report, screenshots, videos, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
